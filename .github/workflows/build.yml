name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 已经预装了 Android SDK。
      # 不用 setup-android action —— 它会卡在交互式接受许可协议那一步。
      - name: Accept SDK licenses
        run: |
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install SDK components
        run: |
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1 | tail -5

      - name: Build unsigned APK
        run: sh build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: backscreen-toolbox-unsigned
          path: build/backscreen-player-unsigned.apk
          if-no-files-found: error

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/backscreen-player-unsigned.apk
